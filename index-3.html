<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>KIA GIMENG | A.M.J</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px; color: #eef4ff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 15% 10%, #263e70 0, transparent 36%),
                  radial-gradient(circle at 85% 90%, #3d286d 0, transparent 34%), #0b1220;
    }
    main {
      width: min(680px, 100%); padding: 42px 30px; text-align: center;
      border: 1px solid #334766; border-radius: 26px;
      background: rgba(18, 29, 49, .92); box-shadow: 0 24px 80px #0008;
    }
    .mark { width: 86px; height: 86px; margin: 0 auto 20px; display: grid;
      place-items: center; border-radius: 24px; font-size: 28px; font-weight: 900;
      color: #101827; background: linear-gradient(135deg, #70e1f5, #a78bfa); }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 48px); letter-spacing: 2px; }
    .tag { margin: 10px 0 28px; color: #a9bbd6; }
    .intro { line-height: 1.7; color: #d8e3f4; }
    .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 26px 0; }
    .pill { padding: 9px 14px; border: 1px solid #405575; border-radius: 999px; color: #dce9ff; background: #17243a; }
    .handles { display: grid; gap: 12px; margin-top: 24px; }
    a { display: block; padding: 13px 16px; border-radius: 13px; text-decoration: none;
      color: #101827; font-weight: 750; background: linear-gradient(90deg, #70e1f5, #b9a0ff); }
    footer { margin-top: 28px; color: #8295b3; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">A.M.J</div>
    <h1>KIA GIMENG</h1>
    <p class="tag">GAMING PROFILE</p>
    <p class="intro">Welcome to my gaming page! I enjoy Minecraft, building, creative projects, and different game modes.</p>
    <div class="stats">
      <span class="pill">Minecraft Java</span>
      <span class="pill">Version 1.19</span>
      <span class="pill">3 years playing</span>
    </div>
    <div class="handles">
      <a href="https://www.minecraft.net/" target="_blank" rel="noopener">Minecraft</a>
      <a href="https://github.com/" target="_blank" rel="noopener">Gaming profile: gimeng1393</a>
      <a href="https://github.com/" target="_blank" rel="noopener">Gaming profile: gimeng505</a>
    </div>
    <footer>Made for KIA GIMENG · A.M.J</footer>

</body>
</html>
